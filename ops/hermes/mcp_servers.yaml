# Declarative mcp_servers entries applied EVERY boot (per-server replace) via
# HERMES_MCP_SERVERS_YAML=$(base64 < ops/hermes/mcp_servers.yaml).
# Only the servers named here are touched; CurAItion / youcom stay as-is.
gbrain:
  url: http://gbrain.railway.internal:3131/mcp
  headers:
    Authorization: Bearer ${HERMES_GBRAIN_TOKEN}
  tools:
    include:
      # read / recall
      - query
      - search
      - recall
      - get_page
      - get_chunks
      - get_backlinks
      - get_links
      - get_timeline
      - volunteer_context
      # code intelligence
      - code_def
      - code_refs
      - code_callers
      - code_callees
      - code_flow
      - code_blast
      # additive writes (curated knowledge only — see GUARDRAILS)
      - put_page
      - extract_facts
      - add_timeline_entry
      - add_tag
      - add_link
      # synthesis
      - think
  enabled: true
linear:
  url: https://mcp.linear.app/mcp
  # Bearer = Linear personal API key (LINEAR_API_KEY on Railway + /data/.hermes/.env). Rick chose
  # API-key auth over the OAuth paste-back (2026-08-16); the key belongs to rick@curaition.xyz —
  # personal keys die with the account that minted them (see linear-autoclose lesson): rotate on offboarding.
  headers:
    Authorization: Bearer ${LINEAR_API_KEY}
  tools:
    include:
      - list_issues
      - search_issues
      - get_issue
      - save_issue
      - list_issue_labels
      - save_comment
  enabled: true
# Hindsight as an MCP server IN ADDITION to the memory plugin. Reason (found live
# 2026-08-16): Hermes hard-codes skip_memory=True for cron jobs (cron/scheduler.py),
# so the plugin's auto-recall/auto-retain never runs in the scout/hygiene sessions.
# MCP tools DO load in cron, so the scout reflects/retains explicitly through this
# server. Same bank, same bearer; the server-side lockdown (15 tools) is the ceiling —
# the include list below is the subset the prompts name.
hindsight:
  url: https://hindsight.curaition.xyz/mcp/hermes-agent/
  headers:
    Authorization: Bearer ${HINDSIGHT_API_KEY}
  tools:
    include:
      - retain
      - recall
      - reflect
      - list_mental_models
      - get_mental_model
      - list_directives
      - get_bank
  enabled: true
# The CODEBASE-RATIONALE bank, read-only. Written by Claude Code sessions in
# ~/Projects/bitcoin-newsletter-multi-domain (bank `coding-agent::curaition`, seeded
# 2026-09-03); Hermes only ever READS it. This is a THIRD store — see RUNBOOK §2, which
# had to be amended to keep the tier boundary honest: GBrain answers "where / what is
# structurally true", `hermes-agent` answers "what have I done and been told", and this
# bank answers "WHY is it this way" (decisions, conventions, rationale, in-flight
# initiatives).
#
# Read-only is load-bearing, not caution. If Hermes could `retain` here, its own
# inferences would consolidate into observations and it would read them back as codebase
# fact — a self-confirming loop where speculation hardens into ground truth. Hermes's
# experiences belong in `hermes-agent`; this bank is Claude Code's to write.
#
# The include list below is the CLIENT-side filter. It is NOT the only guard: the bank's
# server-side `mcp_enabled_tools` is set read-only by
# ops/hindsight/lockdown_coding_bank.sh, because this bearer is shared and the endpoint
# otherwise exposes 29 tools including delete_bank and clear_memories (measured
# 2026-09-03 — the coding bank had mcp_enabled_tools: null, unlike hermes-agent's 15).
# Same principle RUNBOOK §6.2 already states for GBrain.
#
# The `::` in the bank id is sent literally; %3A%3A also resolves (both verified 200).
codebase_memory:
  url: https://hindsight.curaition.xyz/mcp/coding-agent::curaition/
  headers:
    Authorization: Bearer ${HINDSIGHT_API_KEY}
  tools:
    include:
      # the WHY surface — no retain/sync_retain, no create/update/delete/clear
      - recall
      - reflect
      - list_mental_models
      - get_mental_model
      - get_bank
  enabled: true
